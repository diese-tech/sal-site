name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned database contract
        run: npm run check:db-contract

      - name: Lint
        run: npm run lint

      - name: Verify frontend BEM compatibility
        run: npm run check:bem

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Check for service-role key exposure in client code
        run: |
          if grep -r "SUPABASE_SERVICE_ROLE_KEY" src/ --include="*.ts" --include="*.tsx" | grep -v "supabase-admin\|admin-client\|supabaseAdmin\|supabase-server\|/api/\|// " ; then
            echo "ERROR: SUPABASE_SERVICE_ROLE_KEY found in a non-server file"
            exit 1
          fi
          true

      - name: Check SECURITY DEFINER functions pin search_path
        run: bash scripts/check-security-definer.sh

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Audit full dependency graph
        run: npm run audit:full

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for credentials
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          extra_args: --results=verified,unknown
          version: 3.95.9

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test
        env:
          ADMIN_SESSION_SECRET: test-admin-session-secret
          CAPTAIN_SESSION_SECRET: test-captain-secret

  build:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
          ADMIN_PASSWORD: test-admin-password
          ADMIN_SESSION_SECRET: test-admin-session-secret
          # This job intentionally builds without real Supabase credentials to
          # verify the app compiles; E2E_TEST_MODE keeps the mock-data fallback
          # available at build time (#153 gates it behind NODE_ENV otherwise).
          E2E_TEST_MODE: "1"

  e2e-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
          ADMIN_PASSWORD: test-admin-password
          ADMIN_SESSION_SECRET: test-admin-session-secret

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.110.0

      - name: Assemble local-only shared-schema bootstrap
        # supabase/migrations/*.sql assumes the "shared" tables (seasons, orgs, players,
        # matches, standings, announcements, gods, org_brands, player_stats,
        # pending_actions, ...) already exist. They're owned by the separate
        # diese-tech/sal-database project (see supabase/migrations/README.md) and are
        # never created by any file in this repo's migrations, so a from-empty local
        # Supabase instance can't replay them as-is. Concatenate the tracked historical
        # bootstrap (supabase/schema.sql) with a small supplement covering the tables
        # added to the shared schema after schema.sql was last touched (see
        # supabase/ci/local-shared-schema-supplement.sql for exactly which three tables
        # and why) into one file that sorts ahead of 001_*.sql. This file is generated
        # here, at CI time only, and is never committed -- the numbered migration
        # sequence itself stays untouched, per supabase/migrations/README.md.
        run: |
          cat supabase/schema.sql supabase/ci/local-shared-schema-supplement.sql \
            > supabase/migrations/00000000000000_ci_local_shared_schema_bootstrap.sql

      - name: Start local Supabase stack
        # Spins up a disposable local Postgres + GoTrue + PostgREST (+ Kong) stack in
        # Docker and replays every file in supabase/migrations/ in order, including the
        # bootstrap assembled above.
        run: supabase start

      - name: Resolve local Supabase URL/anon key
        id: supabase
        run: |
          supabase status -o json \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            > /tmp/supabase-status.json
          echo "url=$(jq -r '.NEXT_PUBLIC_SUPABASE_URL' /tmp/supabase-status.json)" >> "$GITHUB_OUTPUT"
          echo "anon_key=$(jq -r '.NEXT_PUBLIC_SUPABASE_ANON_KEY' /tmp/supabase-status.json)" >> "$GITHUB_OUTPUT"

      - name: Run RLS integration tests
        run: npm run test:integration
        # No longer advisory: this runs against disposable local infra (started above),
        # not a live allowlisted project, so there's nothing shared at risk and no
        # excuse for a red run to go unnoticed. This is now a required gate.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon_key }}

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
